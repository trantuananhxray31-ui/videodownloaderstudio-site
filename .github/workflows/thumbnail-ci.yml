name: Vietnamese thumbnail tests
on:
  pull_request:
    paths:
      - 'thumbnail-workflow/**'
      - '.github/workflows/thumbnail-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r thumbnail-workflow/requirements.batch.txt
      - run: python -m unittest -v test_workflow.py test_vds_batch.py test_composio_drive.py test_fast_local_thumbnails.py
        working-directory: thumbnail-workflow
